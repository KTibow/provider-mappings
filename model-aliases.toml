# Extra names for model ids. A model id is an OpenRouter model id, exactly as
# OpenRouter writes it ("moonshotai/kimi-k3").
#
# Every OpenRouter model is known automatically, and so are its short name (the
# id without the vendor, "kimi-k3"), its permaslug and any id it was renamed
# from. Add an entry here only to:
#
#   - record a legacy Surplus Intelligence id that is not the short name
#     (backcompat; published in surplus-legacy-ids.json):
#       ["openai/gpt-oss-120b"]
#       surplus_legacy = ["openai-gpt-oss-120b"]
#
#   - add other spellings that should resolve to the model:
#       aliases = ["gpt-oss-120b-instruct"]
#
#   - declare a model OpenRouter does not list (keep the "vendor/slug" shape):
#       ["venice/e2ee-gpt-oss-120b-p"]
#       name = "GPT OSS 120B (E2EE)"
#
#   - merge one OpenRouter id into another: list it in the other's aliases.
#
# A name may resolve to only one model id.

