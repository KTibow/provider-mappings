# Hand-maintained mappings for api.openai.com; highest precedence.

# OpenAI's dated snapshot ids. Each is the checkpoint behind OpenRouter's model
# (its permaslug: openai/gpt-5-2025-08-07, openai/gpt-5-mini-2025-08-07,
# openai/gpt-5.4-20260305). OpenRouter lists the same id under its "-image"
# product too (gpt-5-image, gpt-5-image-mini, gpt-5.4-image-2), which pairs the
# model with an image tool, so the sync holds it for review.
["gpt-5-2025-08-07"]
model = "openai/gpt-5"

["gpt-5-mini-2025-08-07"]
model = "openai/gpt-5-mini"

["gpt-5.4-2026-03-05"]
model = "openai/gpt-5.4"
